name: Kernel Build

on:
  push:
    branches:
      - camellia
  pull_request:
    branches:
      - camellia

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Set up build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev \
          libncurses5-dev libncursesw5-dev git wget curl

    - name: Build kernel
      run: |
        make O=out ARCH=arm64 camellia_defconfig
        make O=out ARCH=arm64 -j$(nproc)
