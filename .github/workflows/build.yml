name: Kernel Build

on:
  push:
    branches:
      - camellia
  pull_request:
    branches:
      - camellia

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libncurses5-dev libncursesw5-dev \
            libssl-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi clang git wget curl

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out camellia_defconfig
          make O=out -j$(nproc)

      - name: List build outputs
        run: |
          echo "Boot directory:"
          ls -lh out/arch/arm64/boot || true
          echo "DTB directory:"
          ls -lh out/arch/arm64/boot/dts || true

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            out/arch/arm64/boot/*
